name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Apple Silicon release
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --locked --release

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          archive="claude-account-${VERSION}-aarch64-apple-darwin.tar.gz"
          mkdir staging
          cp target/release/claude-account README.md LICENSE staging/
          tar -C staging -czf "${archive}" .
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            claude-account-"${VERSION}"-aarch64-apple-darwin.tar.gz \
            claude-account-"${VERSION}"-aarch64-apple-darwin.tar.gz.sha256 \
            --generate-notes \
            --title "${VERSION}"
